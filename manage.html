<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pharmacy management</title><link rel="stylesheet" href="style.css"><style>body{background:#edf3f8}main{max-width:1200px;margin:auto;padding:25px}.admin-head{display:flex;justify-content:space-between;align-items:center}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}h1{font-size:32px}.product-list{max-height:400px;overflow:auto}.product-list button{display:block;width:100%;padding:14px;border:0;border-bottom:1px solid #dde3ea;background:white;text-align:left}label{display:block;margin:12px 0 6px;font-size:13px}#message{white-space:pre-line;position:sticky;top:0;background:#e1eedc;padding:12px;z-index:2}@media(max-width:750px){.admin-grid{grid-template-columns:1fr}main{padding:16px}}button:disabled{opacity:.4}</style></head><body><main><div class="admin-head"><div><span class="eyebrow">Owner workspace</span><h1>Pharmacy management</h1></div><a class="btn outline" href="/">Open store ↗</a></div><p id="message" role="status">Loading your catalogue…</p><div class="admin-grid"><section class="panel"><h2>Pharmacy settings</h2><form id="settings"><label for="businessName">Pharmacy name</label><input id="businessName" required maxlength="100"><label for="businessPhone">WhatsApp number</label><input id="businessPhone" type="tel" required placeholder="03XX XXXXXXX"><label for="pickupAddress">Pharmacy / pickup address</label><textarea id="pickupAddress" maxlength="500"></textarea><label for="city">City</label><input id="city" maxlength="100"><button class="btn" style="margin-top:20px">Save pharmacy settings</button></form><p class="tiny">Saved changes apply to the live store. Refresh an already-open store page to load them.</p></section><section class="panel"><h2>Find a product</h2><input id="search" aria-label="Search products" placeholder="Search name or category"><p id="count" class="tiny"></p><div class="product-list" id="list"></div><button id="new" class="btn light" style="margin-top:18px">+ Add product</button></section><section class="panel" style="grid-column:1/-1"><h2 id="editor-title">Add product</h2><form id="product"><div class="row"><div><label for="name">Product name / strength / pack</label><input id="name" required maxlength="200"></div><div><label for="category">Category</label><input id="category" list="categories" required maxlength="180"><datalist id="categories"></datalist></div></div><div class="row"><div><label for="price">Price (PKR, leave blank for price on request)</label><input id="price" type="number" min="0" max="10000000" step="0.01"></div><div><label for="vendor">Manufacturer</label><input id="vendor" maxlength="200"></div></div><label for="image">Product image URL (HTTPS)</label><input id="image" type="url" placeholder="https://…"><label for="specs">Product specifications / approved information</label><textarea id="specs" rows="5" maxlength="10000" placeholder="Edit or clear specifications here"></textarea><div class="actions"><button class="btn" type="submit">Save product</button><button class="btn outline" id="delete" type="button" disabled>Remove product</button><button class="linkbtn" id="reset" type="button">Clear form</button></div></form></section></div></main><script src="manage.js"></script></body></html>
