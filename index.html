<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumo · Medicine directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page-a:#FFF1C2;--page-b:#CFE3F3;--page-c:#F8CAD6;--page-ink:#17120A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--page-a:#2A2208;--page-b:#10202D;--page-c:#2E0F19;--page-ink:#fff}
}
:root[data-theme="dark"]{--page-a:#2A2208;--page-b:#10202D;--page-c:#2E0F19;--page-ink:#fff}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:linear-gradient(135deg,var(--page-a),var(--page-b) 55%,var(--page-c));
  color:var(--page-ink);
  display:grid;place-items:center;padding:16px;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid currentColor;outline-offset:3px;border-radius:10px}

/* ───────── App frame ───────── */
.app{
  --ink:#17120A;--btnBg:#fff;--btnInk:#17120A;--chip:rgba(23,18,10,.14);--chipA:#17120A;--chipInk:#fff;--accent:#FFD21F;--pill:rgba(23,18,10,.14);
  position:relative;width:min(1240px,100%);height:min(calc(100% - 0px),780px);
  border-radius:34px;overflow:hidden;isolation:isolate;color:var(--ink);
  box-shadow:0 40px 80px -30px rgba(40,20,0,.45),0 0 0 1px rgba(255,255,255,.35) inset;
  transition:color .5s ease;
}
.bg,.rev{position:absolute;inset:0;z-index:-2}
.rev{z-index:-1;clip-path:circle(0 at 50% 50%)}
.grain{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.5;mix-blend-mode:soft-light;
  background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.55),transparent 45%)}

/* ───────── Nav ───────── */
.nav{position:absolute;z-index:6;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:22px 34px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:26px;letter-spacing:-.04em}
.logo svg{width:34px;height:34px;overflow:visible}
.ring{transform-origin:center;transform-box:fill-box;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pills{display:flex;gap:8px;position:absolute;left:50%;transform:translateX(-50%)}
.pill{padding:9px 20px;border-radius:99px;font-weight:600;font-size:14px;background:var(--pill);transition:background .3s,transform .15s}
.pill.on{background:var(--btnBg);color:var(--btnInk)}
.pill:active{transform:scale(.96)}
.icons{display:flex;gap:10px}
.ib{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--pill);transition:transform .15s,background .3s}
.ib:active{transform:scale(.92)}
.ib.cart{background:var(--btnBg);color:var(--btnInk)}
.ib svg{width:19px;height:19px}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:99px;background:#17120A;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;transform:scale(0);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.badge.show{transform:scale(1)}
.bump{animation:bump .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{40%{transform:scale(1.35)}}

/* ───────── Views ───────── */
.views{position:absolute;inset:0}
.view{position:absolute;inset:0;padding:88px 36px 30px;opacity:0;visibility:hidden;transform:translateY(18px);
  transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s .5s}
.view.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.leaves{position:absolute;inset:0;pointer-events:none;z-index:0}
.leaf{position:absolute;fill:rgba(0,0,0,.07);transform-origin:50% 100%;animation:sway 7s ease-in-out infinite alternate}
.leaf.l1{width:min(24vw,260px);left:30%;top:22%;transform:rotate(-24deg)}
.leaf.l2{width:min(20vw,220px);right:27%;top:34%;transform:rotate(26deg) scaleX(-1);animation-delay:-3s}
.leaf.l3{width:min(16vw,170px);left:24%;bottom:12%;transform:rotate(-8deg);animation-delay:-5s}
@keyframes sway{to{translate:0 -10px;rotate:6deg}}

/* Product view */
.product{display:grid;grid-template-columns:1fr minmax(0,1.1fr) 1fr;grid-template-rows:auto 1fr auto;
  grid-template-areas:"tabs tabs tabs" "ttl bottle sizes" "blurb price acts";gap:0 20px}
.tabs{grid-area:tabs;justify-self:center;position:relative;display:inline-flex;gap:2px;padding:4px;border-radius:99px;background:var(--pill);z-index:2;height:max-content}
.tabs button{position:relative;z-index:1;display:flex;align-items:center;gap:8px;padding:9px 20px;border-radius:99px;font-weight:600;font-size:14px;transition:color .3s}
.tabs button svg{width:17px;height:17px}
.tabs button.on{color:var(--btnInk)}
.ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:99px;background:var(--btnBg);box-shadow:0 4px 14px -6px rgba(0,0,0,.35);transition:left .4s cubic-bezier(.3,1.3,.5,1),width .4s cubic-bezier(.3,1.3,.5,1)}

.psheet{display:contents}
.ttl{grid-area:ttl;align-self:start;padding-top:20px;z-index:2}
.ttl h2{font-size:clamp(32px,3.6vw,50px);font-weight:700;line-height:1.04;letter-spacing:-.035em}
.ttl .mg{margin-top:14px;font-size:15px;opacity:.75}
.ttl .line{display:block;overflow:hidden}
.blurb{grid-area:blurb;align-self:end;max-width:30ch;font-size:13px;line-height:1.5;opacity:.8}
.price{grid-area:price;align-self:end;justify-self:center;font-size:clamp(34px,3.4vw,46px);font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.acts{grid-area:acts;justify-self:end;align-self:end;display:flex;align-items:center;gap:20px}
.qty{display:flex;align-items:center;gap:14px;font-weight:700;font-size:18px}
.qty button{width:30px;height:30px;border-radius:50%;border:1.6px solid currentColor;display:grid;place-items:center;transition:transform .15s,background .2s,color .2s}
.qty button:hover{background:var(--ink);color:var(--accent)}
.qty button:active{transform:scale(.86)}
.qty button svg{width:14px;height:14px}
.qty output{min-width:1.2ch;text-align:center;display:inline-block}
.buy{position:relative;display:flex;align-items:center;gap:10px;padding:15px 28px;border-radius:99px;background:var(--btnBg);color:var(--btnInk);font-weight:700;font-size:15px;
  transition:transform .15s,box-shadow .3s;box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}
.buy:hover{box-shadow:0 14px 28px -10px rgba(0,0,0,.55)}
.buy:active{transform:scale(.95)}
.buy svg{width:18px;height:18px}

.bottleWrap{grid-area:bottle;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;perspective:900px;z-index:1}
.tilt{transform-style:preserve-3d;transform:rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg));transition:transform .25s ease-out}
.float{animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px) rotate(1.2deg)}}
.bin svg{height:min(56dvh,440px);width:auto;display:block;overflow:visible}
.photo{height:min(56dvh,440px);width:auto;aspect-ratio:1;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 11%,#000 89%,transparent),linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 11%,#000 89%,transparent),linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);mask-composite:intersect}
.bottleWrap:has(.photo)::after{display:none}
.bottleWrap::after{content:"";position:absolute;bottom:2%;width:42%;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.32),transparent);filter:blur(2px);animation:shadow 5s ease-in-out infinite}
@keyframes shadow{50%{transform:scale(.88);opacity:.7}}

.sizes{grid-area:sizes;justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:14px;padding-top:20px;z-index:2;position:relative}
.chips{display:flex;flex-direction:column;gap:12px;position:relative}
.chips button{width:48px;height:48px;border-radius:50%;background:var(--chip);font-weight:700;font-size:15px;position:relative;z-index:1;transition:color .25s,transform .15s}
.chips button.on{color:var(--chipInk)}
.chips button:active{transform:scale(.9)}
.chips .dot{position:absolute;left:0;width:48px;height:48px;border-radius:50%;background:var(--chipA);z-index:0;transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.info{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.85;text-align:right;transition:opacity .2s}
.info:hover{opacity:1;text-decoration:underline}
.info svg{width:15px;height:15px;flex:none}

/* Home view */
.home{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:96px}
.sub{font-size:15px;line-height:1.35;opacity:.9;position:relative;z-index:2}
.hero{font-size:clamp(58px,min(12vw,15dvh),150px);font-weight:800;line-height:.9;letter-spacing:-.055em;margin-top:10px;position:relative;z-index:2}
.hero .w{display:block;overflow:hidden;padding-bottom:.06em}
.hero .w i{display:block;font-style:normal;transform:translateY(105%)}
.ready .hero .w i{animation:rise .9s cubic-bezier(.2,.9,.2,1) forwards}
.ready .hero .w:nth-child(2) i{animation-delay:.12s}
@keyframes rise{to{transform:none}}
.duo{position:relative;flex:1;width:100%;min-height:0;display:flex;align-items:flex-end;justify-content:center;margin-top:-4dvh;z-index:1}
.hb{position:relative;margin:0 -2.2vw;transition:transform .4s cubic-bezier(.3,1.4,.5,1);transform:translateY(var(--y,0)) rotate(var(--r,0deg)) scale(var(--s,1))}
.hb svg,.hb .photo{height:min(34dvh,310px);width:auto;display:block;overflow:visible}
.hb:hover{transform:translateY(calc(var(--y,0px) - 14px)) rotate(var(--r,0deg)) scale(calc(var(--s,1) * 1.05))}
.hb .float{animation-duration:6s}
.hb.b1{--r:-16deg;--y:20px;z-index:1}
.hb.b2{--r:0deg;--s:1.12;z-index:2}
.hb.b3{--r:16deg;--y:20px;z-index:1}
.hb.b1 .float{animation-delay:-1.5s}.hb.b3 .float{animation-delay:-3s}
.ready .hb{animation:up 1s cubic-bezier(.2,.9,.2,1) both}
.ready .hb.b1{animation-delay:.2s}.ready .hb.b2{animation-delay:.3s}.ready .hb.b3{animation-delay:.4s}
@keyframes up{from{opacity:0;translate:0 80px}}
.homeFoot{position:absolute;left:0;right:0;bottom:0;padding:0 36px 30px;display:flex;align-items:flex-end;justify-content:space-between;z-index:3;pointer-events:none}
.homeFoot>*{pointer-events:auto}
.about{font-size:13px;opacity:.7}
.mission{font-size:clamp(22px,2.6vw,34px);font-weight:700;letter-spacing:-.03em;line-height:1.08;max-width:14ch;text-align:left}
.cta{display:flex;align-items:center;gap:10px;padding:16px 28px;border-radius:99px;background:var(--btnBg);color:var(--btnInk);font-weight:700;box-shadow:0 12px 26px -12px rgba(0,0,0,.5);transition:transform .15s}
.cta:active{transform:scale(.95)}
.cta svg{width:18px;height:18px;transition:transform .3s}.cta:hover svg{transform:translateX(4px)}
.homeFoot .l{display:flex;flex-direction:column;gap:8px}

/* Capsule SVG animation */
.cps{transform-box:fill-box;transform-origin:center;animation:jig 3.4s ease-in-out infinite alternate}
@keyframes jig{to{translate:2px -5px;rotate:14deg}}
.rs{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}

/* ───────── Sheet (basket, info, contact) ───────── */
.scrim{position:absolute;inset:0;z-index:20;background:rgba(15,8,0,.4);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;z-index:21;top:12px;right:12px;bottom:12px;width:min(410px,calc(100% - 24px));background:#fff;color:#17120A;border-radius:26px;
  display:flex;flex-direction:column;transform:translateX(112%);transition:transform .5s cubic-bezier(.2,.9,.2,1);box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.sheet.on{transform:none}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 8px}
.sheet h3{font-size:22px;font-weight:700;letter-spacing:-.03em}
.x{width:36px;height:36px;border-radius:50%;background:#F4EFEA;display:grid;place-items:center;font-size:20px;line-height:1}
.sb{flex:1;overflow:auto;padding:8px 22px 22px;display:flex;flex-direction:column}
.empty{margin:auto;text-align:center;display:grid;gap:14px;justify-items:center;font-size:15px;opacity:.85}
.item{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #F0E8E2;animation:in .4s cubic-bezier(.2,.9,.2,1) both}
@keyframes in{from{opacity:0;translate:16px 0}}
.item svg{height:64px;width:auto;margin:0 auto;overflow:visible}
.item .photo{height:60px;width:60px;border-radius:14px;margin:0 auto;-webkit-mask-image:none;mask-image:none}
.item b{display:block;font-size:15px}.item small{opacity:.65;font-size:12px}
.item .qty{gap:8px;margin-top:8px;font-size:14px}
.item .qty button{width:26px;height:26px;border-width:1.4px}
.item .qty button:hover{background:#17120A;color:#FFD21F}
.item .p{font-weight:700;font-variant-numeric:tabular-nums}
.total{margin-top:auto;padding-top:18px;display:flex;justify-content:space-between;font-weight:700;font-size:18px}
.go{margin-top:14px;width:100%;padding:16px;border-radius:99px;background:#FFD21F;font-weight:800;font-size:15px;transition:transform .15s}
.go:active{transform:scale(.97)}
.stabs{display:flex;gap:6px;margin-bottom:14px}
.stabs button{padding:8px 14px;border-radius:99px;background:#F4EFEA;font-weight:600;font-size:13px}
.stabs button.on{background:#17120A;color:#fff}
.sb p{line-height:1.55;font-size:14px}
.note{margin-top:14px;font-size:12px;opacity:.6}
.ok{margin:auto;display:grid;gap:14px;justify-items:center;text-align:center}
.ok svg{width:84px;height:84px}
.ok path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s .25s ease forwards}
.ok circle{stroke-dasharray:260;stroke-dashoffset:260;animation:draw .7s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

.toast{position:absolute;z-index:30;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;background:#17120A;color:#fff;border-radius:99px;padding:12px 20px;font-weight:600;font-size:14px;
  transition:transform .4s cubic-bezier(.3,1.4,.5,1),opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{transform:translate(-50%,0);opacity:1}
.fx{position:fixed;z-index:100;pointer-events:none;left:0;top:0}

/* ───────── Mobile ───────── */
@media (max-width:860px){
  body{padding:0}
  .app{width:100%;height:100%;border-radius:0}
  .nav{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}
  :root{padding-top:0}
  .logo{font-size:22px}.logo svg{width:30px;height:30px}
  .pills{position:absolute;top:calc(72px + env(safe-area-inset-top,0px));left:50%;z-index:6}
  .app[data-view="product"] .pills{display:none}
  .view{padding:calc(70px + env(safe-area-inset-top,0px)) 0 0}
  .product{display:flex;flex-direction:column;padding-top:calc(72px + env(safe-area-inset-top,0px))}
  .tabs{align-self:flex-start;margin-left:14px;margin-top:6px;background:transparent;padding:0}
  .tabs .ind{background:var(--pill)}
  .tabs button{padding:9px 14px}
  .tabs button.on{color:var(--ink);font-weight:800}
  .bottleWrap{flex:1}
  .bin svg,.photo{height:min(38dvh,330px)}
  .tabs button{padding:9px 11px;font-size:13px}
  .tabs{gap:0}
  .sizes{position:absolute;right:16px;top:calc(124px + env(safe-area-inset-top,0px));padding:0;align-items:center}
  .chips button{width:44px;height:44px}.chips .dot{width:44px;height:44px}
  .info span{display:none}.info{opacity:1;background:var(--chip);width:34px;height:34px;border-radius:50%;justify-content:center}
  .psheet{display:grid;background:#fff;color:#17120A;border-radius:30px 30px 0 0;padding:22px 20px calc(18px + env(safe-area-inset-bottom,0px));
    grid-template-columns:1fr auto;grid-template-areas:"ttl ttl" "price qty" "buy buy";gap:10px 12px;z-index:3;box-shadow:0 -20px 40px -20px rgba(0,0,0,.3)}
  .ttl{padding:0}.ttl h2{font-size:26px}.ttl .mg{margin-top:6px;font-size:13px;color:#8a8580;opacity:1}
  .blurb{display:none}
  .price{justify-self:start;font-size:34px}
  .acts{display:contents}
  .qty{grid-area:qty;justify-self:end}
  .qty button{width:42px;height:42px;border:0;border-radius:14px;background:#17120A;color:#FFD21F}
  .qty button:hover{background:#17120A;color:#FFD21F}
  .qty output{min-width:2ch}
  .buy{grid-area:buy;justify-content:center;background:#FFD21F;color:#17120A;height:54px;box-shadow:none}
  .leaf.l1{left:2%;width:48vw}.leaf.l2{right:2%;width:40vw}.leaf.l3{display:none}
  .home{padding-top:calc(130px + env(safe-area-inset-top,0px))}
  .hero{font-size:clamp(54px,17vw,110px)}
  .hb{margin:0 -5vw}.hb svg{height:min(28dvh,250px)}
  .homeFoot{padding:0 20px calc(22px + env(safe-area-inset-bottom,0px));flex-direction:column;align-items:center;gap:14px;text-align:center}
  .mission{text-align:center;max-width:none;font-size:22px}
  .homeFoot .l{align-items:center}
  .about{display:none}
  .sheet{top:auto;left:0;right:0;bottom:0;width:100%;max-height:82%;border-radius:28px 28px 0 0;transform:translateY(112%)}
  .sheet.on{transform:none}
  .sheet{padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media (max-width:430px){.tabs button svg{display:none}}
@media (max-height:620px) and (max-width:860px){.bin svg,.photo{height:30dvh}.hb svg{height:22dvh}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .hero .w i,.hb{transform:none;opacity:1}}
</style>
</head>
<body>
<main class="app" id="app" data-view="home">
  <div class="bg" id="bg"></div><div class="rev" id="rev"></div><div class="grain"></div>

  <nav class="nav">
    <button class="logo" id="logo" aria-label="Lumo home">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle class="ring" cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-width="4.5" stroke-dasharray="3.2 6.2" stroke-linecap="round"/></svg>
      lumo
    </button>
    <div class="pills" role="tablist" aria-label="Sections">
      <button class="pill" id="pProducts" data-nav="product">Products</button>
      <button class="pill" id="pContact" data-nav="contact">Contact</button>
    </div>
    <div class="icons">
      <button class="ib" id="btnUser" aria-label="Account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.4 7-5.4s6.2 1.8 7 5.4"/></svg></button>
      <button class="ib cart" id="btnCart" aria-label="Open basket"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16l-1.6 9.4a2 2 0 0 1-2 1.6H7.6a2 2 0 0 1-2-1.6z"/><path d="M8.5 9l3.5-5 3.5 5"/></svg><span class="badge" id="badge">0</span></button>
    </div>
  </nav>

  <div class="views">
    <!-- HOME -->
    <section class="view home on" id="vHome" aria-label="Home">
      <p class="sub">Flexible solution<br>for all kind of people</p>
      <h1 class="hero"><span class="w"><i>Powerful</i></span><span class="w"><i>Boost</i></span></h1>
      <div class="duo" id="duo"></div>
      <div class="homeFoot">
        <div class="l"><p class="about">About Lumo</p><p class="mission">Helping humans become happier &amp; healthier!</p></div>
        <button class="cta" data-go="relax">Shop the range <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </section>

    <!-- PRODUCT -->

/* ───────── Theme (circular reveal) ───────── */
let curTheme='home';
function paint(el,t){el.style.background=`radial-gradient(120% 95% at 50% 18%,${t.a} 0%,${t.b} 100%)`}
function vars(t){
  const s=app.style;
  s.setProperty('--ink',t.ink);s.setProperty('--btnBg',t.btnBg);s.setProperty('--btnInk',t.btnInk);
  s.setProperty('--chip',t.chip);s.setProperty('--chipA',t.chipA);s.setProperty('--chipInk',t.chipInk);s.setProperty('--pill',t.pill);
}
paint($('#bg'),THEMES.home);vars(THEMES.home);
function setTheme(key,ev){
  if(key===curTheme)return;
  curTheme=key;const t=THEMES[key];vars(t);
  const rev=$('#rev'),bg=$('#bg'),r=app.getBoundingClientRect();
  let x=r.width/2,y=r.height/2;
  if(ev&&typeof ev.clientX==='number'&&(ev.clientX||ev.clientY)){x=ev.clientX-r.left;y=ev.clientY-r.top}
  const R=Math.hypot(Math.max(x,r.width-x),Math.max(y,r.height-y))+10;
  paint(rev,t);
  if(!D(1)){paint(bg,t);return}
  rev.getAnimations().forEach(a=>a.cancel());
  const a=rev.animate([{clipPath:`circle(0px at ${x}px ${y}px)`},{clipPath:`circle(${R}px at ${x}px ${y}px)`}],{duration:D(650),easing:'cubic-bezier(.3,.7,.1,1)',fill:'forwards'});
  a.onfinish=()=>{paint(bg,t);a.cancel();rev.style.clipPath='circle(0 at 50% 50%)'};
}

const tabs=$('#tabs'),ind=$('#ind'),chips=$('#chips'),dot=$('#dot');
ORDER.forEach(id=>{
  const b=document.createElement('button');b.dataset.id=id;b.setAttribute('role','tab');
  b.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${P[id].icon}</svg>${P[id].name}`;
  tabs.appendChild(b);
});
function buildChips(){
  chips.querySelectorAll('button').forEach(b=>b.remove());
  SZ[st.cur].forEach(s=>{const b=document.createElement('button');b.dataset.size=s;b.textContent=s;b.setAttribute('role','radio');chips.appendChild(b)});
}
if(!SZ[st.cur].includes(st.size))st.size=SZ[st.cur][0];
buildChips();

const duo=$('#duo');
[['b1','sleep'],['b2','relax'],['b3','focus']].forEach(([cls,id])=>{
  const b=document.createElement('button');b.className='hb '+cls;b.dataset.go=id;b.setAttribute('aria-label','Shop '+P[id].name);
  b.innerHTML=`<div class="float">${bottle(id,30)}</div>`;duo.appendChild(b);
});

function placeInd(){
  const on=tabs.querySelector('button.on');if(!on)return;
  ind.style.left=on.offsetLeft+'px';ind.style.width=on.offsetWidth+'px';
  const c=chips.querySelector('button.on');if(c)dot.style.transform=`translateY(${c.offsetTop}px)`;
}

/* ───────── Price count-up ───────── */
let pv=P.relax.prices[30],raf;
function price(to){
  cancelAnimationFrame(raf);const from=pv,t0=performance.now(),d=D(320);
  if(!d){pv=to;$('#price').textContent=money(to);return}
  (function f(n){const k=Math.min(1,(n-t0)/d),e=1-Math.pow(1-k,3);pv=from+(to-from)*e;$('#price').textContent=money(pv);if(k<1)raf=requestAnimationFrame(f);else{pv=to;$('#price').textContent=money(to)}})(t0);
}
const total=()=>P[st.cur].prices[st.size]*st.qty;

/* ───────── Product updates ───────── */
function renderTitle(anim){
  const l1=$('#tl1');l1.textContent=`${P[st.cur].name} ${st.size}`;
  $('#tl2').textContent=P[st.cur].l2;$('#mgv').textContent=P[st.cur].mg;$('#blurbT').textContent=P[st.cur].blurb;
  if(anim&&D(1))l1.animate([{transform:'translateY(100%)'},{transform:'none'}],{duration:D(420),easing:'cubic-bezier(.2,.9,.2,1)'});
}
function mark(){
  tabs.querySelectorAll('button').forEach(b=>{const on=b.dataset.id===st.cur;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
  chips.querySelectorAll('button').forEach(b=>{const on=+b.dataset.size===st.size;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});
  $('#qv').textContent=st.qty;placeInd();
}
function setBottle(first){
  const bin=$('#bin');
  const put=()=>{bin.innerHTML=bottle(st.cur,st.size)};
  if(first||!D(1)){put();return}
  const out=bin.animate([{transform:'none',opacity:1},{transform:'translateY(46px) rotate(-14deg) scale(.88)',opacity:0}],{duration:D(200),easing:'ease-in',fill:'forwards'});
  out.onfinish=()=>{put();out.cancel();
    bin.animate([{transform:'translateY(-70px) rotate(16deg) scale(.88)',opacity:0},{transform:'none',opacity:1}],{duration:D(560),easing:'cubic-bezier(.34,1.45,.64,1)'})};
}
function pick(id,ev){
  if(id===st.cur&&st.view==='product')return;
  st.cur=id;
  if(!SZ[id].includes(st.size))st.size=SZ[id][0];
  buildChips();
  st.view==='product'&&setTheme(id,ev);
  setBottle(false);renderTitle(true);mark();price(total());
}
function setSize(s){
  if(s===st.size)return;st.size=s;
  const bd=document.querySelector('#bin .bdg');if(bd)bd.textContent=s;
  renderTitle(true);mark();price(total());
}
function setQty(n){
  n=Math.max(1,Math.min(9,n));if(n===st.qty)return;st.qty=n;
  const o=$('#qv');o.textContent=n;mark();price(total());
  if(D(1))o.animate([{transform:'scale(1.5)'},{transform:'none'}],{duration:D(300),easing:'cubic-bezier(.34,1.56,.64,1)'});
}

/* ───────── Views ───────── */
function show(view,ev,id){
  if(id)st.cur=id;
  st.view=view;app.dataset.view=view;
  $('#vHome').classList.toggle('on',view==='home');
  $('#vProduct').classList.toggle('on',view==='product');
  $('#pProducts').classList.toggle('on',view==='product');
  if(view==='product'){
    if(!SZ[st.cur].includes(st.size))st.size=SZ[st.cur][0];
    buildChips();setTheme(st.cur,ev);$('#bin').innerHTML=bottle(st.cur,st.size);
    renderTitle(true);mark();price(total());
    requestAnimationFrame(placeInd);
    const w=$('#bw');if(D(1))w.animate([{opacity:0,transform:'translateY(60px) scale(.9)'},{opacity:1,transform:'none'}],{duration:D(700),easing:'cubic-bezier(.2,.9,.2,1)'});
  }else{setTheme('home',ev)}
}

/* ───────── Pointer tilt ───────── */
const tilt=$('#tilt');
app.addEventListener('pointermove',e=>{
  if(reduce||st.view!=='product'||e.pointerType==='touch')return;
  const r=app.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  tilt.style.setProperty('--ry',(x*22).toFixed(1)+'deg');tilt.style.setProperty('--rx',(-y*14).toFixed(1)+'deg');
});
app.addEventListener('pointerleave',()=>{tilt.style.setProperty('--ry','0deg');tilt.style.setProperty('--rx','0deg')});

/* ───────── Toast + effects ───────── */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1900)}
function bumpCart(){
  const n=st.cart.reduce((a,i)=>a+i.qty,0),b=$('#badge');b.textContent=n;b.classList.toggle('show',n>0);
  if(D(1)){b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');$('#btnCart').animate([{transform:'scale(1)'},{transform:'scale(1.18)'},{transform:'scale(1)'}],{duration:D(380),easing:'ease-out'})}
}
function fly(){
  if(!D(1))return;
  const src=$('#bin svg,#bin img'),dst=$('#btnCart');if(!src||!dst)return;
  const a=src.getBoundingClientRect(),b=dst.getBoundingClientRect();
  const el=document.createElement('div');el.className='fx';el.innerHTML=bottle(st.cur,st.size);
  const s=el.firstElementChild;s.style.cssText=`width:${a.width}px;height:${a.height}px;display:block`;
  el.style.transform=`translate(${a.left}px,${a.top}px)`;document.body.appendChild(el);
  const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2);
  const anim=el.animate([
    {transform:`translate(${a.left}px,${a.top}px) scale(1) rotate(0)`,opacity:1,offset:0},
    {transform:`translate(${a.left+dx*.35}px,${a.top+dy*.2-60}px) scale(.55) rotate(-12deg)`,opacity:1,offset:.45},
    {transform:`translate(${a.left+dx}px,${a.top+dy}px) scale(.06) rotate(-25deg)`,opacity:.2,offset:1}
  ],{duration:D(720),easing:'cubic-bezier(.5,0,.8,.4)'});
  anim.onfinish=()=>{el.remove();bumpCart()};
}
function burst(from){
  if(!D(1))return;const r=from.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const cols=['#FFD21F','#fff','#FF9E2C','#17120A'];
  for(let i=0;i<14;i++){
    const c=document.createElement('span');c.className='fx';
    c.style.cssText=`width:16px;height:8px;border-radius:99px;background:${cols[i%4]};left:${cx}px;top:${cy}px`;
    document.body.appendChild(c);const ang=Math.random()*Math.PI*2,dist=70+Math.random()*80;
    c.animate([{transform:'translate(-50%,-50%) rotate(0) scale(1)',opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(ang)*dist}px),calc(-50% + ${Math.sin(ang)*dist}px)) rotate(${Math.random()*360}deg) scale(.6)`,opacity:0}],
      {duration:D(650+Math.random()*250),easing:'cubic-bezier(.1,.7,.3,1)'}).onfinish=()=>c.remove();
  }
}

/* ───────── Cart ───────── */
function add(){
  const f=st.cart.find(i=>i.id===st.cur&&i.size===st.size);
  if(f)f.qty=Math.min(99,f.qty+st.qty);else st.cart.push({id:st.cur,size:st.size,qty:st.qty});
  save();burst($('#buy'));fly();
  toast(`Added ${P[st.cur].name} ${st.size} × ${st.qty}`);
  if(!D(1))bumpCart();
}
const cartTotal=()=>st.cart.reduce((a,i)=>a+P[i.id].prices[i.size]*i.qty,0);

/* ───────── Sheet ───────── */
let lastFocus=null,sheetMode=null;
function openSheet(mode){
  sheetMode=mode;lastFocus=document.activeElement;
  $('#sheet').inert=false;$('#sheet').classList.add('on');$('#scrim').classList.add('on');
  renderSheet(mode);setTimeout(()=>$('#sheetX').focus(),50);
}
function closeSheet(){
  $('#sheet').classList.remove('on');$('#scrim').classList.remove('on');$('#sheet').inert=true;sheetMode=null;
  lastFocus&&lastFocus.focus&&lastFocus.focus();
}
function renderSheet(mode,tab){
  const sb=$('#sb'),T=$('#sheetT');
  if(mode==='cart'){
    T.textContent='Your basket';
    if(!st.cart.length){sb.innerHTML=`<div class="empty"><p>Your basket is empty.<br>Add something from the range.</p><button class="go" id="goShop" style="width:auto;padding:14px 28px">Browse products</button></div>`;
      $('#goShop').onclick=e=>{closeSheet();show('product',e)};return}
    sb.innerHTML=st.cart.map((i,k)=>`<div class="item" style="animation-delay:${k*50}ms"><div>${bottle(i.id,i.size)}</div>
      <div><b>${P[i.id].name} ${i.size}</b><small>${P[i.id].desc}</small>
      <div class="qty" data-k="${k}"><button data-d="-1" aria-label="Decrease">−</button><output>${i.qty}</output><button data-d="1" aria-label="Increase">+</button></div></div>
      <div class="p">${money(P[i.id].prices[i.size]*i.qty)}</div></div>`).join('')+
      `<div class="total"><span>Total</span><span>${money(cartTotal())}</span></div><button class="go" id="checkout">Checkout</button>`;
    sb.querySelectorAll('.qty').forEach(q=>q.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const k=+q.dataset.k,it=st.cart[k];it.qty+=+b.dataset.d;if(it.qty<=0)st.cart.splice(k,1);save();bumpCart();renderSheet('cart')}));
    $('#checkout').onclick=()=>{
      st.cart=[];save();bumpCart();
      sb.innerHTML=`<div class="ok"><svg viewBox="0 0 84 84" fill="none" stroke="#17120A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="42" cy="42" r="37"/><path d="M26 43l11 11 21-23"/></svg><h3>Order placed</h3><p>This is a demo, so nothing was charged.</p><button class="go" id="done" style="width:auto;padding:14px 28px">Keep browsing</button></div>`;
      $('#done').onclick=closeSheet;burst($('#sb .ok svg'));
    };
  }else if(mode==='info'){
    T.textContent=`${P[st.cur].name} ${st.size}`;
    const tabs=['Overview','Dosage','Side effects'],cur=tab||0;
    const body=[
      P[st.cur].photo?'Paracetamol 500 mg tablets, pack of 24. Replace this sample text with the approved product overview.':'Dissolvable wafers with 250 mg per serving. Replace this sample text with your approved product overview.',
      'Sample copy. Show the dosage printed on the real label here, and send people to a pharmacist or doctor if they are unsure.',
      'Sample copy. List the real side effects from the product leaflet here, and say when to stop and get medical advice.'
    ];
    sb.innerHTML=`<div class="stabs">${tabs.map((t,i)=>`<button class="${i===cur?'on':''}" data-i="${i}">${t}</button>`).join('')}</div><p>${body[cur]}</p><p class="note">Placeholder content for this design mock. Not medical advice.</p>`;
    sb.querySelectorAll('.stabs button').forEach(b=>b.onclick=()=>renderSheet('info',+b.dataset.i));
  }else if(mode==='contact'){
    T.textContent='Say hello';
    sb.innerHTML=`<p>Questions about an order or a product? Write to us and a person will reply.</p><p style="margin-top:14px"><b>hello@lumo.example</b></p><button class="go" id="copy">Copy email address</button><p class="note">Sample address for this design mock.</p>`;
    $('#copy').onclick=()=>{try{navigator.clipboard.writeText('hello@lumo.example')}catch(e){}$('#copy').textContent='Copied';setTimeout(()=>{const c=$('#copy');c&&(c.textContent='Copy email address')},1200)};
  }else if(mode==='account'){
    T.textContent='Account';
    sb.innerHTML=`<div class="empty"><p>Sign-in isn't part of this mock.<br>Your basket is saved on this device.</p></div>`;
  }
}

/* ───────── Events ───────── */
tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(b)pick(b.dataset.id,e)});
chips.addEventListener('click',e=>{const b=e.target.closest('button');if(b)setSize(+b.dataset.size)});
$('#qm').onclick=()=>setQty(st.qty-1);$('#qp').onclick=()=>setQty(st.qty+1);
$('#buy').onclick=add;
$('#btnCart').onclick=()=>openSheet('cart');
$('#btnUser').onclick=()=>openSheet('account');
$('#info').onclick=()=>openSheet('info');
$('#pContact').onclick=()=>openSheet('contact');
$('#pProducts').onclick=e=>show('product',e);
$('#logo').onclick=e=>show('home',e);
$('#sheetX').onclick=closeSheet;$('#scrim').onclick=closeSheet;
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g&&g.closest('#vHome'))show('product',e,g.dataset.go)});
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Escape'&&sheetMode){closeSheet();return}
  if(sheetMode||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  const k=e.key.toLowerCase();
  if(st.view==='product'){
    if(['1','2','3','4'].includes(k))pick(ORDER[+k-1]);
    else if(k==='arrowright')pick(ORDER[(ORDER.indexOf(st.cur)+1)%ORDER.length]);
    else if(k==='arrowleft')pick(ORDER[(ORDER.indexOf(st.cur)+ORDER.length-1)%ORDER.length]);
    else if(k==='b')add();
    else if(k==='+'||k==='=')setQty(st.qty+1);
    else if(k==='-')setQty(st.qty-1);
  }
  if(k==='c')openSheet('cart');
  if(k==='h')show('home');
});
addEventListener('resize',placeInd);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(placeInd);

/* ───────── Boot ───────── */
renderTitle(false);$('#bin').innerHTML=bottle(st.cur,st.size);mark();$('#price').textContent=money(total());
bumpCart();
requestAnimationFrame(()=>requestAnimationFrame(()=>app.classList.add('ready')));
})();
</script>

</html>
